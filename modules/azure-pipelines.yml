trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AzureDevOps-Subscription-Conn'

stages:
  - stage: ValidateAndPlan
    displayName: 'Terraform Plan'
    jobs:
      - job: Plan
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-tfstate-storage'
              backendAzureRmStorageAccountName: '<YOUR_UNIQUE_STORAGE_ACCOUNT_NAME>'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'windows-vm.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: ValidateAndPlan
    condition: succeeded()
    jobs:
      - job: Apply
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-tfstate-storage'
              backendAzureRmStorageAccountName: '<YOUR_UNIQUE_STORAGE_ACCOUNT_NAME>'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'windows-vm.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              argsOptions: '-auto-approve'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'